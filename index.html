<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chair Force One</title>
    <!-- The one family the interface is set in, wanted on the first paint — which
         happens long before the module graph that would otherwise discover it has
         finished parsing. -->
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The key art carries the loading screen, so it is wanted on the first paint for
         the same reason the font is: it is the screen, not decoration on it. -->
    <link rel="preload" href="/art/key-art.webp" as="image" />
    <link rel="preload" href="/art/logo.webp" as="image" />
    <style>
      :root { color-scheme: light dark; }
      /* The dark warm the game is graded in.
         Whatever covers this has to agree with it, or the mismatch shows as a
         hairline frame on any window the canvas has not sized to yet, and as a
         flash between the splash leaving and the first frame arriving. It was
         white while the splash was; the splash is key art now, so this follows. */
      html, body { margin: 0; height: 100%; background: #241c15; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }

      /* Declared here as well as in look.ts, and deliberately: this is the page's own
         first paint and it happens before a single module has been evaluated. It is
         also what makes the preload above load *something* — a face nothing has set
         text in yet is a file the browser fetched for no reason, and it will say so in
         the console. */
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-weight: 200 800;
        font-stretch: 75% 100%;
        font-display: block;
        src: url('/fonts/bricolage-latin.woff2') format('woff2');
      }

      /*
       * Building the floor takes about a second and a half — the kit is parsed, the
       * floorplate and its dressing are built, rapier is compiled and every shader is
       * warmed before the first frame is drawn — and a page that shows nothing for that
       * long reads as broken. So it shows a splash.
       */
      /*
       * A splash: the key art full bleed, with the wordmark set over it.
       *
       * This screen used to be white, on the argument that a dim loading frame is
       * indistinguishable from a game running badly. That holds for an empty
       * screen and stops holding the moment there is a picture on it — the art is
       * unmistakably finished, so it cannot be read as a frame that has not
       * arrived, and it does the one job the white screen could not: it says who
       * the game is about before the game has loaded a single one of them.
       *
       * It still cuts to golden hour when it goes, because the art is lit in the
       * same key as the room behind it.
       */
      #boot {
        position: fixed;
        inset: 0;
        background: #241c15;
        display: flex;
        flex-direction: column;
        /*
         * Ranged left, not centred.
         *
         * Two reasons, and the second is the one that matters. The first is the art:
         * the cast races out of the middle-right of the frame and the dog's head is
         * almost exactly where a centred emblem lands, so centring it means covering
         * the one character everybody looks at first. The second is that the menu this
         * screen hands over to has its wordmark hard against the left margin — so a
         * centred splash logo travels across the screen at the wipe, which is the only
         * moment in the game where the same object is on screen twice in two places.
         * Left on both, and the emblem simply stays where it is.
         */
        align-items: flex-start;
        padding-left: clamp(24px, 7vw, 96px);
        /* Low, not centred. The middle of this art is the cast and the sparks —
           the busiest part of the frame — and type over it is unreadable however
           much shadow it is given. The floor along the bottom is the one large
           quiet area, and it is where the scrim is heaviest anyway. */
        justify-content: flex-end;
        padding-bottom: clamp(26px, 7vh, 74px);
        gap: 16px;
        transition: opacity 460ms ease;
      }
      #boot.gone { opacity: 0; }
      /* Cover, so it fills any window without ever showing a letterbox — the art is
         wide, and a splash with bars is a splash that did not fit. Centred low so the
         crop keeps the cast rather than the ceiling when the window is tall. */
      #boot .art {
        position: absolute;
        inset: 0;
        background: url('/art/key-art.webp') center 42% / cover no-repeat;
      }
      /* The type needs a floor to sit on. A wash that is heaviest at the bottom and
         barely there across the middle keeps the office readable while giving the
         wordmark its own ground. */
      #boot .scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(20, 14, 9, 0.5) 0%, rgba(20, 14, 9, 0.18) 34%,
                          rgba(20, 14, 9, 0) 58%),
          linear-gradient(180deg, rgba(20, 14, 9, 0.34) 0%, rgba(20, 14, 9, 0.06) 30%,
                          rgba(20, 14, 9, 0.30) 62%, rgba(20, 14, 9, 0.86) 100%);
      }
      /*
       * And a glow under the emblem, in the emblem's own vermilion with the room's
       * amber around it.
       *
       * The art is a busy frame and the logo lands in the busiest part of it — a dog,
       * a chair and a shower of sparks directly behind the word FORCE. A drop shadow
       * gives the artwork an edge but not a ground, so the lockup still reads as a
       * sticker. This is the ground: light of the kind the emblem would throw if it
       * were in the room, which separates it from the cast without dimming them, and
       * which is the same pair of colours the menu's burst is made of.
       */
      #boot .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(30% 26% at 30% 66%, rgba(238, 82, 33, 0.32), transparent 72%),
          radial-gradient(44% 36% at 28% 68%, rgba(242, 160, 43, 0.16), transparent 74%);
      }
      #boot .lockup {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }
      /* The wordmark is artwork, not type, so nothing here has to track the menu's
         type scale — but everything under it does track the menu's furniture, which
         is the flag, the lean and the glow: the same three things, because this is
         the same screen twice. It is a wide emblem, so it is sized on width and only
         capped on height — the other way round and a short window would leave it a
         stripe. */
      #boot .logo {
        width: min(58vw, 560px);
        height: auto;
        max-height: 42vh;
        object-fit: contain;
        filter: drop-shadow(0 12px 34px rgba(12, 8, 4, 0.6));
      }
      /*
       * The slashes, which are what the hairline under the wordmark became — the same
       * change the menu's rail made, and made here for the same reason: the emblem
       * has a run of tapered streaks trailing off its words, so the one piece of
       * furniture under it should be those rather than a generic rule. It was a
       * chequered flag for one release, which was the right answer to the emblem
       * before this one; there is not a single square in the new artwork.
       *
       * Short, and shorter than it wants to be, because this is the one screen where
       * a horizontal band sitting directly above a status line has an obvious second
       * reading — and a progress bar that never fills is a worse thing to put on a
       * loading screen than no bar at all.
       */
      #boot .flag {
        width: clamp(104px, 12vw, 160px);
        height: 15px;
        background-image:
          linear-gradient(90deg, #ee5221 0%, rgba(238, 82, 33, 0) 100%),
          linear-gradient(90deg, #ee5221 0%, rgba(238, 82, 33, 0) 100%),
          linear-gradient(90deg, #ee5221 0%, rgba(238, 82, 33, 0) 100%);
        background-size: 100% 3px, 64% 3px, 38% 3px;
        background-position: 0 0, 0 6px, 0 12px;
        background-repeat: no-repeat;
        transform: skewX(-11deg);
        filter: drop-shadow(0 2px 6px rgba(12, 8, 4, 0.8));
      }
      /* Set the way the menu's captions are: caps, tracked wide, leaning the emblem's
         eleven degrees. A loading note is the smallest type on the screen and the last
         thing anyone reads, which makes it the cheapest place to say the screen and the
         logo were drawn by the same hand. */
      #boot .note {
        font-family: 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, sans-serif;
        font-weight: 700;
        font-variation-settings: 'opsz' 14;
        font-size: 11.5px;
        letter-spacing: 0.2em;
        /* Tracking is added after every letter including the last, so a centred line
           sits half a space left of centre. Paid back at the front. */
        text-indent: 0.2em;
        text-transform: uppercase;
        transform: skewX(-11deg);
        color: rgba(246, 239, 226, 0.72);
        text-shadow: 0 1px 10px rgba(12, 8, 4, 0.6);
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="boot">
      <div class="art"></div>
      <div class="scrim"></div>
      <div class="glow"></div>
      <div class="lockup">
        <img class="logo" src="/art/logo.webp" alt="Chair Force One" />
        <div class="flag"></div>
        <div class="note">Setting up the office</div>
      </div>
    </div>
    <script type="module" src="/src/skins/clay/main.ts"></script>
  </body>
</html>
