<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chair Force One</title>
    <!-- The one family the interface is set in, wanted on the first paint — which
         happens long before the module graph that would otherwise discover it has
         finished parsing. -->
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      :root { color-scheme: light dark; }
      /* Paper, not near-black.
         The card that covers this is white, and the two have to agree: a body in
         the dark warm the game is graded in shows as a hairline frame around a
         white card on any window the canvas has not sized to yet, and as a flash
         between the card leaving and the first frame arriving. */
      html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }

      /* Declared here as well as in look.ts, and deliberately: this is the page's own
         first paint and it happens before a single module has been evaluated. It is
         also what makes the preload above load *something* — a face nothing has set
         text in yet is a file the browser fetched for no reason, and it will say so in
         the console. */
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-weight: 200 800;
        font-stretch: 75% 100%;
        font-display: block;
        src: url('/fonts/bricolage-latin.woff2') format('woff2');
      }

      /*
       * Building the floor takes about a second and a half — the kit is parsed, the
       * floorplate and its dressing are built, rapier is compiled and every shader is
       * warmed before the first frame is drawn — and a page that shows nothing for that
       * long reads as broken. So it shows the wordmark, in the same setting the menu
       * opens with, which makes the hand-over invisible.
       */
      /*
       * White, and it is the one screen in the game that is.
       *
       * Everything after it is a sunset seen from inside a building — warm, low,
       * and dark at the edges. A loading screen in the same key reads as the game
       * already running badly: you cannot tell a deliberately dim frame from one
       * that has not finished. White cannot be mistaken for anything: it is
       * unmistakably a page, it makes the wordmark the only thing in the room, and
       * the cut to golden hour when it goes is the first thing the game does.
       */
      #boot {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        transition: opacity 460ms ease;
      }
      #boot.gone { opacity: 0; }
      /* The same lockup the menu opens with, down to the clamp: two lines, the second one
         amber, and a checkpoint donut standing in for the O of ONE. It is set here by
         hand rather than imported because this markup has to render before a single
         module has been evaluated — and if the two ever drift, the wipe between them
         turns into a cut. */
      #boot .mark {
        font-family: 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, sans-serif;
        font-weight: 800;
        font-stretch: 100%;
        font-variation-settings: 'opsz' 96;
        font-size: clamp(40px, 5.2vw, 74px);
        line-height: 0.92;
        letter-spacing: -0.022em;
        text-transform: uppercase;
        text-align: center;
        color: #241c15;
      }
      #boot .mark span { display: block; white-space: nowrap; }
      #boot .mark .one {
        /* A shade deeper than the interface's amber. The same #f2a02b that carries
           a dark screen sits at about 2.2:1 on white, which is a colour rather than
           a word; this is the same hue with enough of it left to read as type. */
        color: #d98416;
        display: flex;
        align-items: baseline;
        justify-content: center;
      }
      #boot .mark .donut {
        width: 0.78em;
        height: 0.78em;
        margin-right: 0.01em;
        transform: translateY(0.075em);
      }
      /* One hairline and one word, both in the interface's own register. */
      #boot .rule {
        width: clamp(180px, 22vw, 300px);
        height: 1px;
        background: rgba(36, 28, 21, 0.16);
      }
      #boot .note {
        font-family: 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, sans-serif;
        font-weight: 600;
        font-variation-settings: 'opsz' 14;
        font-size: 13px;
        color: rgba(36, 28, 21, 0.5);
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="boot">
      <div class="mark">
        <span>Chair Force</span>
        <span class="one">
          <svg class="donut" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="33" fill="none" stroke="#ee3e7b" stroke-width="26" />
          </svg>NE
        </span>
      </div>
      <div class="rule"></div>
      <div class="note">Setting up the office</div>
    </div>
    <script type="module" src="/src/skins/clay/main.ts"></script>
  </body>
</html>
